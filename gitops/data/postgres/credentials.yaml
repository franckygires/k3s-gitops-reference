# The application's database credentials, pulled from Vault. Git holds the reference, never the value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-app
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: pg-app
    template:
      # The type CloudNativePG expects for the owner of the application database.
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: demo/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: demo/postgres
        property: password
