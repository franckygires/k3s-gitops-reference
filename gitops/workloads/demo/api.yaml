# The demo application: PostgREST, a stock image that exposes the `events` table over HTTP.
# No custom code, so the repository stays about the platform.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgrest
          image: postgrest/postgrest:v16.5
          env:
            # pg-rw always points at the current primary, whichever node it runs on.
            - name: PGRST_DB_URI
              value: postgres://pg-rw:5432/app
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: password
            - name: PGRST_DB_SCHEMAS
              value: public
            - name: PGRST_DB_ANON_ROLE
              value: web_anon
            - name: PGRST_SERVER_PORT
              value: "3000"
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3000
            - name: admin
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /live
              port: admin
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    # cert-manager issues and renews the certificate; nobody handles a key by hand.
    cert-manager.io/cluster-issuer: local-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts: [demo.localtest.me]
      secretName: api-tls
  rules:
    - host: demo.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
