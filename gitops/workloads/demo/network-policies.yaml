# Ingress is closed by default in this namespace; each allowed flow is listed below.
# Scope: ingress only. Egress is left open (see "Limits" in the README).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Internet -> Traefik -> API. Nothing else may call the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-ingress
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
---
# API -> PostgreSQL, and PostgreSQL <-> PostgreSQL for replication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-api-and-peers
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg
      ports:
        - port: 5432
---
# The CloudNativePG operator reads each instance's status and manages failover.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-operator
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
        - port: 5432
