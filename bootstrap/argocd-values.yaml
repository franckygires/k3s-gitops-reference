# Argo CD, trimmed to what this repository uses: no SSO, no notifications, no ApplicationSets.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0

configs:
  params:
    # TLS is not terminated by Argo CD here: the UI is only reached through `make ui` (port-forward).
    server.insecure: true
  cm:
    # Poll Git every 30 s so a local change shows up quickly. Production would use webhooks.
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 10s
    # Let a parent Application wait for its children. Without this, sync waves between
    # Applications have no effect: an Application counts as healthy the moment it exists.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
